<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>e.lab · Lista da Vez</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,wght@0,500;0,600;1,500;1,600&display=swap');
:root{--bg:#f6f2e9;--card:#fff;--ink:#1c1a16;--muted:#786f5c;--line:rgba(28,26,22,.1);--gold:#8a6a2f;--gold-soft:rgba(138,106,47,.12);--green:#456c54;--red:#8d4f4a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1040px;margin:auto;padding:38px 24px 70px}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.eyebrow,.label{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}h1,h2,h3{font-family:Newsreader,serif;font-weight:600;letter-spacing:-.025em}h1{font-size:42px;margin:10px 0 8px}h2{font-size:28px;margin:0 0 7px}.sub{font-size:13px;color:var(--muted);line-height:1.6;margin:0}.live{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:30px;padding:9px 13px;background:#fff}.live:before{content:'';display:inline-block;width:6px;height:6px;background:#5c8b63;border-radius:50%;margin-right:7px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:28px 0 14px}.tab{border:1px solid var(--line);background:transparent;border-radius:999px;padding:9px 14px;font-size:12px;color:var(--muted)}.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}.bar{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-bottom:13px;margin-bottom:22px}.bar button{background:transparent;border:0;color:var(--muted);padding:7px 9px;font-size:12px}.bar button.active{color:var(--ink);font-weight:700;border-bottom:2px solid var(--gold)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}.panel-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:18px}.count{font-family:Newsreader,serif;font-size:35px;color:var(--gold)}.next{background:var(--gold-soft);border:1px solid rgba(138,106,47,.22);border-radius:15px;padding:14px;margin-bottom:13px}.next small{color:var(--gold);font-size:10px;letter-spacing:.12em;text-transform:uppercase}.next strong{display:block;font-family:Newsreader,serif;font-size:28px;margin:5px 0}.queue{display:flex;flex-direction:column;gap:7px}.person{display:flex;align-items:center;gap:12px;padding:12px 10px;border-bottom:1px solid var(--line)}.person:last-child{border-bottom:0}.rank{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#eee9df;color:var(--muted);font-size:11px;font-weight:700}.rank.first{background:var(--gold);color:#fff}.person-name{font-size:13px;font-weight:600;flex:1}.person-meta{font-size:10px;color:var(--muted)}.badge{font-size:9px;letter-spacing:.08em;text-transform:uppercase;border-radius:20px;padding:5px 7px;background:#eee9df;color:var(--muted)}.badge.present{background:#e5efe7;color:var(--green)}.badge.returned{background:#f4ecd8;color:var(--gold)}.schedule{grid-column:1/-1}.form{display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:10px;align-items:end}.field label{display:block;font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid var(--line);border-radius:11px;background:#fff;padding:11px 10px;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--gold)}.primary{border:0;border-radius:11px;background:var(--ink);color:#fff;padding:12px 15px;font-size:11px;font-weight:600;white-space:nowrap}.primary:hover{background:#423a2d}.scheduled-list{display:flex;flex-direction:column;gap:9px}.appointment{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}.appointment-top{display:flex;justify-content:space-between;gap:12px}.appointment-name{font-weight:600;font-size:13px}.appointment-meta{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.6}.appointment-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:13px}.small{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-size:10px;color:var(--muted)}.small.confirm{border-color:#b8d0be;color:var(--green);background:#f4faf5}.small.fail{border-color:#e0b9b5;color:var(--red);background:#fff8f7}.small:hover{filter:brightness(.97)}.status{font-size:9px;letter-spacing:.08em;text-transform:uppercase;border-radius:20px;padding:6px 8px}.status.pending{background:#f4ecd8;color:var(--gold)}.status.due{background:#fff0e9;color:#a95e40}.status.confirmed{background:#e5efe7;color:var(--green)}.status.missed{background:#f5e5e3;color:var(--red)}.empty{font-size:12px;color:var(--muted);padding:18px 0}.history{grid-column:1/-1}.history-row{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding:12px 0;font-size:12px}.history-row:last-child{border-bottom:0}.history-row span{color:var(--muted);font-size:10px;text-align:right}.notice{font-size:11px;line-height:1.6;color:var(--muted);background:#fbf8f1;border:1px solid var(--line);padding:12px 14px;border-radius:12px;margin-top:12px}@media(max-width:760px){.shell{padding:27px 16px 50px}.top{display:block}.live{display:inline-block;margin-top:17px}.grid{grid-template-columns:1fr}.schedule,.history{grid-column:auto}.form{grid-template-columns:1fr 1fr}.form .primary{grid-column:1/-1}.appointment-top{display:block}.appointment-top .status{display:inline-block;margin-top:9px}}
</style>
</head>
<body>
<div class="shell"><div class="top"><div><div class="eyebrow">BRGS.app / listadavez</div><h1>Lista da Vez</h1><p class="sub">Motor de distribuição por departamento, com controle de antecipações e retorno de profissionais.</p></div><div class="live">Atualização operacional</div></div>
<div class="tabs" id="departments"></div><div class="bar"><button class="active" id="tabFila" onclick="showTab('fila')">Filas</button><button id="tabSchedule" onclick="showTab('agendamentos')">Agendamentos antecipados</button><button id="tabHistory" onclick="showTab('historico')">Histórico</button></div>
<main id="content"></main></div>
<script>
const departments=[['cab','Cabeleireiros'],['man','Manicure padrão'],['gel','Serviço de gel'],['sob','Sobrancelhas'],['make','Maquiagem']];
const seed={cab:[{name:'Evinho',present:false,attended:0},{name:'Allan',present:true,attended:1},{name:'Dani',present:true,attended:1},{name:'Luiza',present:true,attended:0}],man:[],gel:[],sob:[],make:[]};
const key='elab_lista_da_vez_v2';
let db=JSON.parse(localStorage.getItem(key)||'null')||{dept:'cab',queues:seed,schedules:[],history:[]};
let activeTab='fila';
function save(){localStorage.setItem(key,JSON.stringify(db))}function today(){return new Date().toISOString().slice(0,10)}function fmtDate(v){if(!v)return 'sem data';const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}function deptName(){return departments.find(d=>d[0]===db.dept)?.[1]||'Cabeleireiros'}function isDue(s){return s.status==='agendado'&&s.date<=today()}
function renderDepartments(){document.getElementById('departments').innerHTML=departments.map(([id,name])=>`<button class="tab ${id===db.dept?'active':''}" onclick="selectDept('${id}')">${name}</button>`).join('')}
function selectDept(id){db.dept=id;save();render()}function showTab(tab){activeTab=tab;render()}
function render(){renderDepartments();document.getElementById('tabFila').classList.toggle('active',activeTab==='fila');document.getElementById('tabSchedule').classList.toggle('active',activeTab==='agendamentos');document.getElementById('tabHistory').classList.toggle('active',activeTab==='historico');if(activeTab==='fila')renderFila();if(activeTab==='agendamentos')renderSchedule();if(activeTab==='historico')renderHistory()}
function queue(){return db.queues[db.dept]||[]}
function renderFila(){const q=queue(),next=q.find(p=>p.present);document.getElementById('content').innerHTML=`<div class="grid"><section class="panel"><div class="panel-head"><div><div class="label">Atendimento da vez</div><h2>Imediato</h2><p class="sub">Próxima profissional disponível · somente presentes</p></div><div class="count">${q.filter(p=>p.present).length}</div></div>${next?`<div class="next"><small>Próxima da vez</small><strong>${esc(next.name)}</strong><span class="person-meta">Presente · ${next.attended||0} atendimento(s)</span></div>`:'<div class="empty">Nenhuma profissional presente na fila.</div>'}<div class="queue">${q.map((p,i)=>person(p,i)).join('')}</div></section><section class="panel"><div class="panel-head"><div><div class="label">Atendimento antecipado</div><h2>Antecipado</h2><p class="sub">A data define quando a conferência será necessária.</p></div><div class="count">${db.schedules.filter(s=>s.dept===db.dept&&s.status==='agendado').length}</div></div>${renderDuePreview()}<div class="notice">Agendamentos vencidos aparecem como <b>pendentes de conferência</b>. O profissional só retorna à fila depois que o operador marca o atendimento como não realizado.</div></section><section class="panel schedule"><div class="panel-head"><div><div class="label">Controle rápido</div><h2>Novo agendamento</h2><p class="sub">Registre a data antes de reservar a vez.</p></div></div>${scheduleForm()}</section></div>`}
function person(p,i){return `<div class="person"><div class="rank ${i===0?'first':''}">${i+1}</div><div class="person-name">${esc(p.name)}<div class="person-meta">${p.attended||0} atendimento(s)</div></div><span class="badge ${p.returned?'returned':p.present?'present':''}">${p.returned?'retornada':p.present?'presente':'ocupada'}</span></div>`}
function renderDuePreview(){const list=db.schedules.filter(s=>s.dept===db.dept&&s.status==='agendado').sort((a,b)=>a.date.localeCompare(b.date));if(!list.length)return '<div class="empty">Nenhuma antecipação cadastrada.</div>';return `<div class="scheduled-list">${list.slice(0,4).map(s=>appointment(s,true)).join('')}</div>`}
function scheduleForm(){const people=queue();return `<div class="form"><div class="field"><label>Cliente</label><input id="client" placeholder="Nome da cliente"></div><div class="field"><label>Profissional</label><select id="professional">${people.map(p=>`<option value="${esc(p.name)}">${esc(p.name)}</option>`).join('')}</select></div><div class="field"><label>Data obrigatória</label><input id="date" type="date" min="${today()}" value="${today()}"></div><div class="field"><label>Serviço</label><input id="service" placeholder="Ex.: corte"></div><button class="primary" onclick="schedule()">Agendar</button></div>`}
function schedule(){const client=document.getElementById('client')?.value.trim(),professional=document.getElementById('professional')?.value,date=document.getElementById('date')?.value,service=document.getElementById('service')?.value.trim();if(!client||!professional||!date){alert('Cliente, profissional e data são obrigatórios.');return}db.schedules.push({id:crypto.randomUUID(),dept:db.dept,client,professional,date,service,status:'agendado',createdAt:new Date().toISOString()});db.history.unshift({text:`Agendamento antecipado criado para ${client}`,detail:`${professional} · ${fmtDate(date)} · ${deptName()}`,at:new Date().toISOString()});save();activeTab='agendamentos';render()}
function appointment(s){const due=isDue(s);let action='';if(s.status==='agendado')action=due?`<button class="small confirm" onclick="confirmSchedule('${s.id}')">Confirmado / realizado</button><button class="small fail" onclick="missSchedule('${s.id}')">Não realizado · devolver à fila</button>`:`<span class="status pending">Agendado · aguarda a data</span>`;if(s.status==='confirmado')action='<span class="status confirmed">Confirmado</span>';if(s.status==='nao_realizado')action='<span class="status missed">Não realizado · retornou à fila</span>';return `<article class="appointment"><div class="appointment-top"><div><div class="appointment-name">${esc(s.client)}</div><div class="appointment-meta"><b>${esc(s.professional)}</b> · ${fmtDate(s.date)}${s.service?' · '+esc(s.service):''}</div></div>${due&&s.status==='agendado'?'<span class="status due">Conferência pendente</span>':''}</div><div class="appointment-actions">${action}</div></article>`}
function renderSchedule(){const list=db.schedules.filter(s=>s.dept===db.dept).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('content').innerHTML=`<div class="grid"><section class="panel schedule"><div class="panel-head"><div><div class="label">Agenda da vez · ${deptName()}</div><h2>Antecipações</h2><p class="sub">Quando a data chega, a recepção confirma ou encerra como não realizado.</p></div><div class="count">${list.filter(s=>s.status==='agendado').length}</div></div>${list.length?`<div class="scheduled-list">${list.map(s=>appointment(s)).join('')}</div>`:'<div class="empty">Nenhum agendamento antecipado para este departamento.</div>'}</section></div>`}
function confirmSchedule(id){const s=db.schedules.find(x=>x.id===id);if(!s)return;s.status='confirmado';db.history.unshift({text:`${s.client} confirmado`,detail:`${s.professional} · ${fmtDate(s.date)}`,at:new Date().toISOString()});save();render()}
function missSchedule(id){const s=db.schedules.find(x=>x.id===id);if(!s||s.status!=='agendado')return;const q=db.queues[s.dept]||[];const p=q.find(x=>x.name===s.professional);if(p){p.returned=true;p.returnedFrom=s.id;}else{q.push({name:s.professional,present:true,attended:0,returned:true,returnedFrom:s.id});}s.status='nao_realizado';s.closedAt=new Date().toISOString();db.history.unshift({text:`${s.client} não realizado`,detail:`${s.professional} retornou à fila · perda de ${fmtDate(s.date)}`,at:s.closedAt});save();activeTab='fila';render()}
function renderHistory(){document.getElementById('content').innerHTML=`<div class="grid"><section class="panel history"><div class="panel-head"><div><div class="label">Rastreabilidade operacional</div><h2>Histórico</h2><p class="sub">Nenhuma perda é apagada: o encerramento fica registrado.</p></div></div>${db.history.length?db.history.map(h=>`<div class="history-row"><div>${esc(h.text)}</div><span>${esc(h.detail)}<br>${new Date(h.at).toLocaleString('pt-BR')}</span></div>`).join(''):'<div class="empty">Ainda não há movimentações registradas.</div>'}</section></div>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}render();
</script>
</body></html>
